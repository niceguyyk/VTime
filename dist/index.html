<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#151515" />
  <meta name="description" content="A simple time zone converter with daylight saving support and fixed UTC offsets." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='10' y='10' width='44' height='44' rx='14' transform='rotate(45 32 32)' fill='%2320201f'/%3E%3Crect x='25' y='25' width='14' height='14' rx='4' fill='none' stroke='white' stroke-width='4'/%3E%3C/svg%3E" />
  <title>VTime — Time Zone Converter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="app.js" defer></script>
</head>
<body>
  <main class="tool-wrap">
    <div class="brand" aria-label="VTime"><span class="brand-icon" aria-hidden="true"><i></i></span><span>VTime<span class="brand-period">.</span></span></div>
    <h1>Time zone converter</h1>
    <section class="calculator-shell" aria-label="Time zone calculator">
      <div class="calculator-body">
        <div class="input-row">
          <div class="field date-field"><label for="date">DATE</label><div class="input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></svg><input type="date" id="date" required /></div></div>
          <div class="field time-field"><label for="time">TIME</label><div class="input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><input type="time" id="time" value="01:00" required /></div></div>
        </div>
        <div class="zones">
          <div class="zone-block"><label for="fromZone">FROM</label><div class="select-wrap"><span class="zone-symbol" aria-hidden="true">↗</span><select id="fromZone"></select><span class="select-arrow" aria-hidden="true">⌄</span></div><span class="zone-detail" id="fromDetail"></span></div>
          <button type="button" class="swap-button" id="swap" aria-label="Swap time zones" title="Swap time zones"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h15m0 0-4-4m4 4-4 4M20 17H5m0 0 4-4m-4 4 4 4"/></svg></button>
          <div class="zone-block"><label for="toZone">TO</label><div class="select-wrap"><span class="zone-symbol" aria-hidden="true">↘</span><select id="toZone"></select><span class="select-arrow" aria-hidden="true">⌄</span></div><span class="zone-detail" id="toDetail"></span></div>
        </div>
        <div class="result" aria-live="polite"><div class="result-label">CONVERTED TIME</div><div class="result-content"><div><div class="result-time" id="resultTime">–</div><div class="result-date" id="resultDate">Choose a date and time</div></div><button type="button" id="copy" class="copy-button" aria-label="Copy result" title="Copy result"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button></div><div class="result-foot" id="resultFoot">Daylight saving time is handled automatically.</div></div>
        <p class="error-message" id="error" role="alert" hidden></p>
      </div>
    </section>
  </main>
  <a class="admin-link" href="/admin" aria-label="Open staff planner" title="Staff planner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v7c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12v7c0 1.7 3.6 3 8 3s8-1.3 8-3v-7"/></svg></a>
</body>
</html>
